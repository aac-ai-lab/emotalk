<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#333">
    <title>Emotalk - Comunicação Aumentativa e Alternativa</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: #fafafa;
            color: #333;
        }

        .quick-icons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            min-height: 48px;
            position: fixed;
            top: 0;
            left: 0;
            right: 48px;
            background: #fff;
            border-bottom: 1px solid #eee;
            z-index: 1;
            overflow-x: auto;
        }

        .quick-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            background: transparent;
        }
        .quick-icon:hover { background: #f0f0f0; }
        .quick-icon.dragging { opacity: 0.5; cursor: grabbing; }
        .quick-icon.drag-over { outline: 2px dashed #333; outline-offset: 2px; }

        .quick-icon-text { font-size: 0.7rem; color: #666; }

        .main-content {
            margin-top: 48px;
            height: calc(100vh - 48px);
            margin-right: 48px;
            display: flex;
            justify-content: center;
        }

        .categories,
        .words {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            padding: 12px;
            width: 100%;
            max-width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        .category,
        .word {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 0.15s;
        }
        .category:hover,
        .word:hover { background: #f5f5f5; }

        .category-icon,
        .word-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .category-name,
        .word-name { font-size: 0.75rem; color: #555; }

        /* Colourful Semantics - cores por papel na frase */
        .semantic-who { border-left: 4px solid #e67e22; }
        .semantic-what-doing { border-left: 4px solid #f1c40f; }
        .semantic-what { border-left: 4px solid #27ae60; }
        .semantic-where { border-left: 4px solid #3498db; }
        .semantic-when { border-left: 4px solid #8b6914; }
        .semantic-describing { border-left: 4px solid #9b59b6; }
        .category.semantic-who, .word.semantic-who { background: #fef5ee; }
        .category.semantic-what-doing, .word.semantic-what-doing { background: #fefce8; }
        .category.semantic-what, .word.semantic-what { background: #f0f9f4; }
        .category.semantic-where, .word.semantic-where { background: #eef6fc; }
        .category.semantic-when, .word.semantic-when { background: #f5f0e6; }
        .category.semantic-describing, .word.semantic-describing { background: #f8f0fc; }
        .quick-icon.semantic-who { border-left: 4px solid #e67e22; background: #fef5ee; }
        .quick-icon.semantic-what-doing { border-left: 4px solid #f1c40f; background: #fefce8; }
        .quick-icon.semantic-what { border-left: 4px solid #27ae60; background: #f0f9f4; }
        .quick-icon.semantic-where { border-left: 4px solid #3498db; background: #eef6fc; }
        .quick-icon.semantic-when { border-left: 4px solid #8b6914; background: #f5f0e6; }
        .quick-icon.semantic-describing { border-left: 4px solid #9b59b6; background: #f8f0fc; }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: 48px;
            background: #fff;
            border-left: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .control-button {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            opacity: 0.8;
        }
        .control-button:hover { opacity: 1; }

        #backButton { display: none; }

        @media (min-width: 768px) {
            .quick-icons {
                right: 56px;
                padding: 10px 24px;
                min-height: 56px;
            }
            .main-content {
                margin-top: 56px;
                margin-right: 56px;
                height: calc(100vh - 56px);
            }
            .sidebar { width: 56px; }
            .categories,
            .words {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
                padding: 20px;
                max-width: 1100px;
            }
            .category,
            .word { padding: 16px 12px; }
            .category-icon,
            .word-icon { font-size: 1.6rem; margin-bottom: 6px; }
            .category-name,
            .word-name { font-size: 0.8rem; }
        }

        @media (min-width: 1200px) {
            .quick-icons {
                right: 64px;
                padding: 12px 32px;
                min-height: 60px;
            }
            .main-content {
                margin-right: 64px;
                margin-top: 60px;
                height: calc(100vh - 60px);
            }
            .sidebar { width: 64px; }
            .control-button { font-size: 1.5rem; padding: 10px; }
            .categories,
            .words {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 16px;
                padding: 24px;
                max-width: 1200px;
            }
            .category,
            .word { padding: 20px 16px; border-radius: 6px; }
            .category-icon,
            .word-icon { font-size: 1.8rem; margin-bottom: 8px; }
            .category-name,
            .word-name { font-size: 0.85rem; }
        }

        .splash-screen {
            position: fixed;
            inset: 0;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
            cursor: pointer;
        }
        .splash-screen.hidden { opacity: 0; pointer-events: none; }
        .splash-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin: 0;
            letter-spacing: 0.04em;
        }

        body.font-large .category-name,
        body.font-large .word-name,
        body.font-large .quick-icon-text { font-size: 0.9rem; }
        body.font-large .category-icon,
        body.font-large .word-icon { font-size: 1.75rem; }

        .settings-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.open { display: flex; }
        .settings-modal {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .settings-modal h2 { margin: 0 0 16px; font-size: 1.1rem; color: #333; }
        .settings-row { margin-bottom: 16px; }
        .settings-row label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
        .settings-row input[type="range"] { width: 100%; }
        .settings-row output { font-size: 0.85rem; color: #666; margin-left: 8px; }
        .settings-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }
        .settings-actions button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .settings-actions button.primary { background: #333; color: #fff; border-color: #333; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 200;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="splash-screen" id="splashScreen" role="dialog" aria-label="Carregando Emotalk">
        <h1 class="splash-title">Emotalk</h1>
    </div>

    <div class="quick-icons" id="quickIcons"></div>

    <div class="main-content">
        <div class="categories" id="categories"></div>
        <div class="words" id="words" style="display: none;"></div>
    </div>

    <div class="sidebar">
        <button id="playButton" class="control-button" title="Falar" aria-label="Falar frase">🔊</button>
        <button id="clearButton" class="control-button" title="Limpar" aria-label="Limpar barra">🗑️</button>
        <button id="settingsButton" class="control-button" title="Configurações" aria-label="Configurações">🔧</button>
        <button id="backButton" class="control-button" title="Início" aria-label="Voltar às categorias">🏠</button>
    </div>

    <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-modal">
            <h2 id="settingsTitle">Configurações</h2>
            <div class="settings-row">
                <label for="speechRate">Velocidade da fala</label>
                <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1">
                <output id="speechRateValue">1</output>
            </div>
            <div class="settings-row">
                <label><input type="checkbox" id="fontLarge"> Fonte maior</label>
            </div>
            <div class="settings-row" style="font-size:0.8rem;color:#666;margin-top:12px;padding-top:12px;border-top:1px solid #eee;">
                <strong>Legenda (Colourful Semantics)</strong><br>
                <span style="display:inline-block;width:8px;height:8px;background:#e67e22;vertical-align:middle;"></span> Quem &nbsp;
                <span style="display:inline-block;width:8px;height:8px;background:#f1c40f;vertical-align:middle;"></span> O quê faz &nbsp;
                <span style="display:inline-block;width:8px;height:8px;background:#27ae60;vertical-align:middle;"></span> O quê &nbsp;
                <span style="display:inline-block;width:8px;height:8px;background:#3498db;vertical-align:middle;"></span> Onde &nbsp;
                <span style="display:inline-block;width:8px;height:8px;background:#8b6914;vertical-align:middle;"></span> Quando &nbsp;
                <span style="display:inline-block;width:8px;height:8px;background:#9b59b6;vertical-align:middle;"></span> Como/Descrever
            </div>
            <div class="settings-actions">
                <button type="button" id="settingsClose">Fechar</button>
                <button type="button" id="settingsSave" class="primary">Salvar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="vocabulary.js"></script>
    <script>
        const categories = window.categories || [];
        const STORAGE_QUICK = 'emotalk_quick';
        const STORAGE_SETTINGS = 'emotalk_settings';

        /* Colourful Semantics: mapeamento categoria -> papel na frase */
        var SEMANTIC_MAP = {
            pessoas: { key: 'who', label: 'Quem' },
            atividades: { key: 'what-doing', label: 'O quê faz' },
            ações: { key: 'what-doing', label: 'O quê faz' },
            lugares: { key: 'where', label: 'Onde' },
            casa: { key: 'where', label: 'Onde' },
            tempo: { key: 'when', label: 'Quando' },
            descrever: { key: 'describing', label: 'Como/Descrever' },
            emoções: { key: 'describing', label: 'Como/Descrever' },
            cores: { key: 'describing', label: 'Como/Descrever' }
        };
        function getSemanticClass(categoryName) {
            var m = SEMANTIC_MAP[categoryName];
            return m ? 'semantic-' + m.key : 'semantic-what';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function () {});
        }

        (function initSplash() {
            const splash = document.getElementById('splashScreen');
            const hideSplash = function () {
                splash.classList.add('hidden');
                setTimeout(function () { splash.remove(); }, 500);
            };
            splash.addEventListener('click', hideSplash, { once: true });
            splash.addEventListener('touchstart', hideSplash, { once: true, passive: true });
            setTimeout(hideSplash, 2500);
        })();

        const quickIcons = document.getElementById('quickIcons');
        const categoriesDiv = document.getElementById('categories');
        const wordsDiv = document.getElementById('words');
        const backButton = document.getElementById('backButton');
        const playButton = document.getElementById('playButton');
        const clearButton = document.getElementById('clearButton');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsButton = document.getElementById('settingsButton');
        const speechRateInput = document.getElementById('speechRate');
        const speechRateValue = document.getElementById('speechRateValue');
        const fontLargeCheck = document.getElementById('fontLarge');
        const settingsClose = document.getElementById('settingsClose');
        const settingsSave = document.getElementById('settingsSave');
        const toastEl = document.getElementById('toast');

        function getSettings() {
            try {
                const s = JSON.parse(localStorage.getItem(STORAGE_SETTINGS) || '{}');
                return {
                    speechRate: typeof s.speechRate === 'number' ? s.speechRate : 1,
                    fontLarge: !!s.fontLarge
                };
            } catch (e) { return { speechRate: 1, fontLarge: false }; }
        }

        function applySettings() {
            const s = getSettings();
            document.body.classList.toggle('font-large', s.fontLarge);
        }

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(function () { toastEl.classList.remove('show'); }, 2500);
        }

        function saveQuickBar() {
            const items = Array.from(quickIcons.querySelectorAll('.quick-icon')).map(function (el) {
                const nameEl = el.querySelector('.quick-icon-text');
                const iconEl = el.querySelector('.word-icon');
                const name = nameEl ? nameEl.textContent.trim() : '';
                const iconChar = iconEl ? (iconEl.textContent || '').trim() : '';
                var category = el.getAttribute('data-category') || '';
                if (!category) {
                    for (var i = 0; i < categories.length; i++) {
                        for (var j = 0; j < categories[i].words.length; j++) {
                            if (categories[i].words[j].name === name) {
                                category = categories[i].name;
                                break;
                            }
                        }
                    }
                }
                return name ? { name: name, icon: iconChar || '•', category: category } : null;
            }).filter(Boolean);
            try { localStorage.setItem(STORAGE_QUICK, JSON.stringify(items)); } catch (e) {}
        }

        function restoreQuickBar() {
            try {
                const raw = localStorage.getItem(STORAGE_QUICK);
                if (!raw) return;
                const items = JSON.parse(raw);
                items.forEach(function (item) {
                    appendQuickIcon(item);
                });
            } catch (e) {}
        }

        var quickIconDragging = false;

        function appendQuickIcon(word) {
            var categoryName = word.category || '';
            var semanticClass = getSemanticClass(categoryName);
            const quickIconDiv = document.createElement('div');
            quickIconDiv.classList.add('quick-icon', semanticClass);
            quickIconDiv.setAttribute('role', 'button');
            quickIconDiv.setAttribute('tabindex', '0');
            quickIconDiv.setAttribute('data-category', categoryName);
            quickIconDiv.setAttribute('aria-label', word.name + '. Arrastar para reordenar, clique para remover.');
            quickIconDiv.setAttribute('draggable', 'true');
            quickIconDiv.innerHTML = '<span class="word-icon" aria-hidden="true">' + (word.icon || '•') + '</span><span class="quick-icon-text">' + word.name + '</span>';

            quickIconDiv.addEventListener('click', function () {
                if (quickIconDragging) return;
                quickIconDiv.remove();
                saveQuickBar();
            });

            quickIconDiv.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); quickIconDiv.click(); }
            });

            quickIconDiv.addEventListener('dragstart', function (e) {
                quickIconDragging = true;
                e.dataTransfer.setData('text/plain', String(Array.prototype.indexOf.call(quickIcons.children, quickIconDiv)));
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setDragImage(quickIconDiv, 0, 0);
                quickIconDiv.classList.add('dragging');
            });

            quickIconDiv.addEventListener('dragend', function () {
                quickIconDiv.classList.remove('dragging');
                quickIcons.querySelectorAll('.quick-icon').forEach(function (el) { el.classList.remove('drag-over'); });
                setTimeout(function () { quickIconDragging = false; }, 0);
            });

            quickIconDiv.addEventListener('dragover', function (e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (e.currentTarget.classList.contains('dragging')) return;
                e.currentTarget.classList.add('drag-over');
            });

            quickIconDiv.addEventListener('dragleave', function (e) {
                e.currentTarget.classList.remove('drag-over');
            });

            quickIconDiv.addEventListener('drop', function (e) {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                var fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
                var items = Array.from(quickIcons.querySelectorAll('.quick-icon'));
                var toIndex = items.indexOf(e.currentTarget);
                if (fromIndex === toIndex || fromIndex < 0) return;
                var dragged = items[fromIndex];
                quickIcons.insertBefore(dragged, e.currentTarget);
                saveQuickBar();
            });

            quickIcons.appendChild(quickIconDiv);
        }

        function showCategories() {
            categories.forEach(function (category) {
                const categoryDiv = document.createElement('div');
                categoryDiv.classList.add('category', getSemanticClass(category.name));
                categoryDiv.setAttribute('role', 'button');
                categoryDiv.setAttribute('tabindex', '0');
                categoryDiv.setAttribute('aria-label', 'Categoria ' + category.name);
                categoryDiv.innerHTML = '<div class="category-icon" aria-hidden="true">' + category.icon + '</div><div class="category-name">' + category.name + '</div>';
                categoryDiv.addEventListener('click', function () {
                    speakCategory(category.name);
                    showWords(category);
                });
                categoryDiv.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); categoryDiv.click(); }
                });
                categoriesDiv.appendChild(categoryDiv);
            });
        }

        function showWords(category) {
            categoriesDiv.style.display = 'none';
            wordsDiv.style.display = 'grid';
            wordsDiv.innerHTML = '';
            backButton.style.display = 'inline-block';
            var words = category.words;
            var semanticClass = getSemanticClass(category.name);
            words.forEach(function (word) {
                const wordDiv = document.createElement('div');
                wordDiv.classList.add('word', semanticClass);
                wordDiv.setAttribute('role', 'button');
                wordDiv.setAttribute('tabindex', '0');
                wordDiv.setAttribute('aria-label', 'Palavra ' + word.name);
                wordDiv.innerHTML = '<div class="word-icon" aria-hidden="true">' + word.icon + '</div><div class="word-name">' + word.name + '</div>';
                wordDiv.addEventListener('click', function () { addToQuickIcons(word, category.name); });
                wordDiv.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wordDiv.click(); }
                });
                wordsDiv.appendChild(wordDiv);
            });
        }

        function addToQuickIcons(word, categoryName) {
            speakWord(word.name);
            appendQuickIcon({ name: word.name, icon: word.icon, category: categoryName });
            saveQuickBar();
        }

        function clearQuickIcons() {
            quickIcons.innerHTML = '';
            saveQuickBar();
        }

        function playIcons() {
            const children = quickIcons.querySelectorAll('.quick-icon-text');
            if (!children.length) {
                showToast('Adicione palavras na barra acima.');
                return;
            }
            const message = Array.from(children).map(function (el) { return el.textContent; }).join(' ');
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.voice = getVoice('pt-BR');
            utterance.rate = getSettings().speechRate;
            speechSynthesis.speak(utterance);
        }

        function speakWord(word) {
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.voice = getVoice('pt-BR');
            utterance.rate = getSettings().speechRate;
            speechSynthesis.speak(utterance);
        }

        function speakCategory(category) {
            const utterance = new SpeechSynthesisUtterance(category);
            utterance.voice = getVoice('pt-BR');
            utterance.rate = getSettings().speechRate;
            speechSynthesis.speak(utterance);
        }

        function getVoice(lang) {
            const voices = speechSynthesis.getVoices();
            return voices.find(function (v) { return v.lang.startsWith(lang); }) || null;
        }

        backButton.addEventListener('click', function () {
            categoriesDiv.style.display = 'grid';
            wordsDiv.style.display = 'none';
            backButton.style.display = 'none';
        });

        playButton.addEventListener('click', playIcons);
        clearButton.addEventListener('click', clearQuickIcons);

        settingsButton.addEventListener('click', function () {
            var s = getSettings();
            speechRateInput.value = s.speechRate;
            speechRateValue.textContent = s.speechRate;
            fontLargeCheck.checked = s.fontLarge;
            settingsOverlay.classList.add('open');
            speechRateInput.focus();
        });

        speechRateInput.addEventListener('input', function () {
            speechRateValue.textContent = speechRateInput.value;
        });

        settingsClose.addEventListener('click', function () { settingsOverlay.classList.remove('open'); });
        settingsSave.addEventListener('click', function () {
            var s = {
                speechRate: parseFloat(speechRateInput.value) || 1,
                fontLarge: fontLargeCheck.checked
            };
            try { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(s)); } catch (e) {}
            applySettings();
            settingsOverlay.classList.remove('open');
        });

        settingsOverlay.addEventListener('click', function (e) {
            if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
        });

        applySettings();
        showCategories();
        restoreQuickBar();
    </script>
</body>

</html>
