<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#333">
    <title>Emotalk - Comunicação Aumentativa e Alternativa</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/index.css">
</head>

<body>
    <div class="splash-screen" id="splashScreen" role="dialog" aria-label="Carregando Emotalk">
        <h1 class="splash-title">Emotalk</h1>
    </div>

    <div class="quick-icons" id="quickIcons"></div>

    <div class="main-content">
        <div class="categories" id="categories"></div>
        <div class="words" id="words" style="display: none;"></div>
    </div>

    <div class="sidebar">
        <button id="playButton" class="control-button" title="Falar" aria-label="Falar frase">🔊</button>
        <button id="clearButton" class="control-button" title="Limpar" aria-label="Limpar barra">🗑️</button>
        <button id="settingsButton" class="control-button" title="Configurações" aria-label="Configurações">🔧</button>
        <button id="backButton" class="control-button" title="Início" aria-label="Voltar às categorias">🏠</button>
    </div>

    <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-modal">
            <h2 id="settingsTitle">Configurações</h2>
            <div class="settings-row">
                <label for="langSelect" id="langLabel">Idioma</label>
                <select id="langSelect" aria-label="Idioma">
                    <option value="pt-BR">Português (Brasil)</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="settings-row">
                <label for="speechRate">Velocidade da fala</label>
                <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1">
                <output id="speechRateValue">1</output>
            </div>
            <div class="settings-row">
                <label><input type="checkbox" id="fontLarge"> Fonte maior</label>
            </div>
            <div class="settings-row settings-legend">
                <strong>Legenda (Colourful Semantics)</strong>
                <span style="background:#e67e22"></span> Quem
                <span style="background:#f1c40f"></span> O quê faz
                <span style="background:#27ae60"></span> O quê
                <span style="background:#3498db"></span> Onde
                <span style="background:#8b6914"></span> Quando
                <span style="background:#9b59b6"></span> Como/Descrever
            </div>
            <div class="settings-row settings-history">
                <strong>Histórico de frases</strong>
                <ul id="historyList" class="history-list" aria-label="Últimas frases faladas"></ul>
                <button type="button" id="clearHistoryBtn" class="history-clear">Limpar histórico</button>
            </div>
            <div class="settings-actions">
                <button type="button" id="settingsClose">Fechar</button>
                <button type="button" id="settingsSave" class="primary">Salvar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="assets/js/vocabulary.js"></script>
    <script src="assets/js/translations.js"></script>
    <script src="assets/js/index.js"></script>
</body>

</html>
